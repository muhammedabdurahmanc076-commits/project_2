<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyShare — Student Notes Sharing Platform</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">📚 StudyShare</div>
    <nav id="nav">
      <button data-view="browse" class="navbtn active">Browse</button>
      <button data-view="upload" class="navbtn">Upload</button>
      <button data-view="bookmarks" class="navbtn">Bookmarks</button>
      <button data-view="notifications" class="navbtn">Notifications</button>
      <button data-view="moderation" class="navbtn mod-only" style="display:none">Moderation</button>
    </nav>
    <div id="authArea"></div>
  </header>

  <main id="app">

    <!-- AUTH -->
    <section id="view-auth" class="view">
      <div class="authbox">
        <div class="tabs">
          <button class="tab active" data-tab="login">Login</button>
          <button class="tab" data-tab="register">Register</button>
        </div>
        <form id="loginForm" class="authform">
          <input type="email" name="email" placeholder="Email" required>
          <input type="password" name="password" placeholder="Password" required>
          <button type="submit">Log in</button>
        </form>
        <form id="registerForm" class="authform" style="display:none">
          <input type="text" name="name" placeholder="Full name" required>
          <input type="email" name="email" placeholder="Email" required>
          <input type="password" name="password" placeholder="Password" required>
          <button type="submit">Create account</button>
        </form>
        <p id="authMsg" class="msg"></p>
      </div>
    </section>

    <!-- BROWSE -->
    <section id="view-browse" class="view">
      <div class="toolbar">
        <input id="searchInput" placeholder="Search notes…">
        <input id="courseInput" placeholder="Course code">
        <input id="tagInput" placeholder="Tag">
        <select id="sortSelect">
          <option value="">Newest</option>
          <option value="top_rated">Top rated</option>
          <option value="most_viewed">Most viewed</option>
        </select>
        <button id="searchBtn">Search</button>
      </div>
      <div id="notesList" class="notes-grid"></div>
    </section>

    <!-- NOTE DETAIL -->
    <section id="view-note" class="view">
      <button id="backToBrowse">&larr; Back</button>
      <div id="noteDetail"></div>
    </section>

    <!-- UPLOAD -->
    <section id="view-upload" class="view">
      <h2>Upload Notes</h2>
      <form id="uploadForm" class="uploadform">
        <input type="text" name="title" placeholder="Title" required>
        <input type="text" name="subject" placeholder="Subject">
        <input type="text" name="course_code" placeholder="Course code (e.g. CS301)">
        <input type="text" name="semester" placeholder="Semester">
        <input type="text" name="tags" placeholder="Tags (comma-separated)">
        <textarea name="description" placeholder="Short description"></textarea>
        <input type="file" name="file" required>
        <button type="submit">Upload</button>
      </form>
      <p id="uploadMsg" class="msg"></p>
    </section>

    <!-- BOOKMARKS -->
    <section id="view-bookmarks" class="view">
      <h2>My Bookmarks</h2>
      <div id="bookmarksList" class="notes-grid"></div>
    </section>

    <!-- NOTIFICATIONS -->
    <section id="view-notifications" class="view">
      <h2>Notifications</h2>
      <ul id="notificationsList" class="notif-list"></ul>
    </section>

    <!-- MODERATION -->
    <section id="view-moderation" class="view">
      <h2>Moderation Dashboard</h2>
      <div id="statsBox" class="stats-box"></div>
      <h3>Open Reports</h3>
      <div id="reportsList"></div>
    </section>

  </main>

  <script src="/app.js"></script>
</body>
</html>
